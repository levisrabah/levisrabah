<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Levis Rabah, software engineer. Websites, SaaS, databases, servers and automation.">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#30363d" stroke-opacity="0.45"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9be9a8"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="300" rx="14"/></clipPath>
    <clipPath id="typed">
      <rect x="46" y="150" height="30" width="0">
        <animate attributeName="width" values="0;240;240;0" keyTimes="0;0.3;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="300" fill="#0d1117"/>
    <rect width="900" height="300" fill="url(#grid)"/>
    <rect width="900" height="300" fill="url(#glow)"/>
    <rect x="0" y="-3" width="900" height="2" fill="#3fb950" opacity="0.18">
      <animate attributeName="y" from="-3" to="300" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="none" stroke="#30363d"/>

  <!-- status pill -->
  <rect x="46" y="32" width="190" height="26" rx="13" fill="#0f2417" stroke="#238636"/>
  <circle cx="62" cy="45" r="4" fill="#3fb950"/>
  <circle cx="62" cy="45" r="4" fill="none" stroke="#3fb950" stroke-width="2">
    <animate attributeName="r" values="4;10" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="76" y="49.5" class="mono" font-size="12" letter-spacing="1.2" fill="#3fb950">ALL SYSTEMS ONLINE</text>

  <!-- name -->
  <text x="44" y="122" class="sans" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1">Levis Rabah
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" fill="freeze"/>
  </text>

  <!-- typed role -->
  <g clip-path="url(#typed)">
    <text x="46" y="173" class="mono" font-size="22" font-weight="600" fill="#3fb950">Software Engineer</text>
  </g>
  <rect x="46" y="153" width="10" height="24" fill="#3fb950">
    <animate attributeName="x" values="46;274;274;46" keyTimes="0;0.3;0.9;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- tagline -->
  <text x="46" y="208" class="sans" font-size="19" fill="#8b949e">I build software around the people who use it.</text>

  <!-- service chips -->
  <g class="mono" font-size="12.5" fill="#e6edf3">
    <g opacity="0"><rect x="46" y="228" width="84" height="28" rx="14" fill="#161b22" stroke="#30363d"/><text x="88" y="246.5" text-anchor="middle">websites</text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/></g>
    <g opacity="0"><rect x="140" y="228" width="58" height="28" rx="14" fill="#161b22" stroke="#30363d"/><text x="169" y="246.5" text-anchor="middle">SaaS</text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.6s" fill="freeze"/></g>
    <g opacity="0"><rect x="208" y="228" width="94" height="28" rx="14" fill="#161b22" stroke="#30363d"/><text x="255" y="246.5" text-anchor="middle">databases</text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/></g>
    <g opacity="0"><rect x="312" y="228" width="78" height="28" rx="14" fill="#161b22" stroke="#30363d"/><text x="351" y="246.5" text-anchor="middle">servers</text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.0s" fill="freeze"/></g>
    <g opacity="0"><rect x="400" y="228" width="100" height="28" rx="14" fill="#161b22" stroke="#30363d"/><text x="450" y="246.5" text-anchor="middle">automation</text><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/></g>
  </g>

  <!-- workstation -->
  <g>
    <!-- floating symbols -->
    <g class="mono" font-size="16" font-weight="700">
      <text x="842" y="66" fill="#3fb950">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="4s" repeatCount="indefinite"/></text>
      <text x="848" y="128" fill="#58a6ff">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5s" repeatCount="indefinite"/></text>
    </g>
    <!-- gear -->
    <g transform="translate(860 170)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
        <circle r="10" fill="none" stroke="#3fb950" stroke-width="4" stroke-dasharray="4 3"/>
        <circle r="5.5" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
      </g>
    </g>

    <!-- monitor -->
    <rect x="585" y="52" width="240" height="150" rx="9" fill="#161b22" stroke="#3a424d" stroke-width="2"/>
    <rect x="585" y="52" width="240" height="22" rx="9" fill="#21262d"/>
    <rect x="585" y="64" width="240" height="10" fill="#21262d"/>
    <circle cx="600" cy="63" r="3.5" fill="#ff5f56"/>
    <circle cx="612" cy="63" r="3.5" fill="#ffbd2e"/>
    <circle cx="624" cy="63" r="3.5" fill="#27c93f"/>
    <text x="705" y="66.5" text-anchor="middle" class="mono" font-size="9.5" fill="#8b949e">app.js</text>

    <g>
      <rect x="603" y="90" height="7" rx="3.5" fill="#bc8cff" width="0"><animate attributeName="width" values="0;40;40;0" keyTimes="0;0.12;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="648" y="90" height="7" rx="3.5" fill="#58a6ff" width="0"><animate attributeName="width" values="0;64;64;0" keyTimes="0;0.18;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="619" y="106" height="7" rx="3.5" fill="#3fb950" width="0"><animate attributeName="width" values="0;96;96;0" keyTimes="0;0.26;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="619" y="122" height="7" rx="3.5" fill="#8b949e" width="0"><animate attributeName="width" values="0;60;60;0" keyTimes="0;0.34;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="685" y="122" height="7" rx="3.5" fill="#ffa657" width="0"><animate attributeName="width" values="0;50;50;0" keyTimes="0;0.38;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="619" y="138" height="7" rx="3.5" fill="#58a6ff" width="0"><animate attributeName="width" values="0;82;82;0" keyTimes="0;0.46;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="603" y="154" height="7" rx="3.5" fill="#bc8cff" width="0"><animate attributeName="width" values="0;28;28;0" keyTimes="0;0.52;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="636" y="154" height="7" rx="3.5" fill="#3fb950" width="0"><animate attributeName="width" values="0;52;52;0" keyTimes="0;0.56;0.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="603" y="172" width="7" height="11" fill="#3fb950"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- stand and desk -->
    <path d="M692,202 L688,230 L722,230 L718,202 Z" fill="#21262d" stroke="#3a424d" stroke-width="2" stroke-linejoin="round"/>
    <rect x="660" y="230" width="90" height="8" rx="4" fill="#21262d" stroke="#3a424d" stroke-width="2"/>
    <path d="M570,248 H880" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>

    <!-- server -->
    <g transform="translate(860 226)">
      <rect x="-20" y="-28" width="40" height="12" rx="3" fill="#161b22" stroke="#3a424d" stroke-width="1.8"/>
      <rect x="-20" y="-14" width="40" height="12" rx="3" fill="#161b22" stroke="#3a424d" stroke-width="1.8"/>
      <rect x="-20" y="0" width="40" height="12" rx="3" fill="#161b22" stroke="#3a424d" stroke-width="1.8"/>
      <circle cx="-12" cy="-22" r="2.3" fill="#3fb950"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="-12" cy="-8" r="2.3" fill="#3fb950"><animate attributeName="opacity" values="1;0.25;1" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="-12" cy="6" r="2.3" fill="#58a6ff"><animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/></circle>
      <path d="M-4,-22 H12 M-4,-8 H12 M-4,6 H12" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
